[project]
name = "lmaobot"
version = "0.6.9"
description = "Dank meme bot for Chatango using ch.py"
authors = ["LmaoLover <hello@lmao.love>"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.1,<3.0.0",
    "pytz>=2022.2.1,<2023.0.0",
    "pyyaml>=6.0,<7.0",
    "youtube-search>=2.1.1,<3.0.0",
    "python-dotenv>=0.21.0,<0.22.0",
    "lxml>=4.9.3,<5.0.0",
    "beautifulsoup4>=4.12.2,<5.0.0",
    "html5lib>=1.1,<2.0",
    "chatango-lib",
    "anthropic>=0.49.0,<0.50.0",
    "mcstatus>=11.1.1,<12.0.0",
    "markdown>=3.7,<4.0",
    "guessit>=3.8.0,<4.0.0",
    "rapidfuzz>=3.13.0,<4.0.0",
]

[tool.uv.sources]
chatango-lib = { git = "https://github.com/LmaoLover/chatango-lib.git", branch = "master" }
# chatango-lib = { path = "../chatango-lib", editable = true }

[tool.uv]
package = false
